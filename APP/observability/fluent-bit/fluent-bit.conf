[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Tag               relaymart.*
    Refresh_Interval  5
    Mem_Buf_Limit     8MB
    Skip_Long_Lines   On

[FILTER]
    Name      grep
    Match     relaymart.*
    Regex     log "service"

[FILTER]
    Name         parser
    Match        relaymart.*
    Key_Name     log
    Parser       relaymart
    Reserve_Data On
    Preserve_Key On

[OUTPUT]
    Name                 es
    Match                relaymart.*
    Host                 elasticsearch
    Port                 9200
    Logstash_Format      On
    Logstash_Prefix      relaymart
    Suppress_Type_Name   On
    Replace_Dots         On
    Retry_Limit          False
    tls                  Off
