apiVersion: v1
kind: Namespace
metadata:
  name: relaymart
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: relaymart
spec:
  rules:
    - host: relaymart.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 4000 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: relaymart
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: relaymart
  labels: { app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4173"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: frontend
          image: relaymart/frontend:latest
          ports: [{ containerPort: 4173 }]
          env:
            - { name: ENTRY, value: frontend/server.js }
            - { name: PORT, value: "4173" }
            - { name: SERVICE_NAME, value: frontend }
            - { name: CATALOG_URL, value: http://catalog:4001 }
            - { name: SEARCH_URL, value: http://search:4002 }
            - { name: PRICING_URL, value: http://pricing:4003 }
            - { name: INVENTORY_URL, value: http://inventory:4004 }
            - { name: CART_URL, value: http://cart:4005 }
            - { name: ORDER_URL, value: http://order:4006 }
            - { name: PAYMENT_URL, value: http://payment:4007 }
            - { name: SHIPPING_URL, value: http://shipping:4008 }
            - { name: REVIEW_URL, value: http://review:4009 }
            - { name: USER_URL, value: http://user:4010 }
            - { name: NOTIFICATION_URL, value: http://notification:4011 }
            - { name: RECOMMENDATION_URL, value: http://recommendation:4012 }
            - { name: AUTH_URL, value: http://auth:4013 }
            - { name: VERIFICATION_URL, value: http://verification:4014 }
            - { name: TRACKING_URL, value: http://tracking:4015 }
            - { name: DATABASE_URL, value: postgres://relay:relay@postgres:5432/relaymart }
            - { name: REDIS_URL, value: redis://redis:6379 }
            - { name: RABBIT_URL, value: amqp://relay:relay@rabbitmq:5672 }
            - { name: GATEWAY_PUBLIC_URL, value: http://gateway:4000 }
          readinessProbe:
            httpGet: { path: /health, port: 4173 }
            initialDelaySeconds: 2
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: relaymart
spec:
  selector: { app: frontend }
  ports: [{ port: 4173, targetPort: 4173 }]
---
